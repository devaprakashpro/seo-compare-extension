<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SEO RenderRank</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">SEO <span>RenderRank</span></div>
      <nav class="sidebar-nav">
        <button class="side-link active" data-page="compare">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>
          Audit URLs
        </button>
        <button class="side-link" data-page="history">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Recent Comparisons
        </button>
        <button class="side-link" data-page="settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
      </nav>
      <a class="sidebar-credit" href="https://kudometrics.com/" target="_blank" rel="noopener">
        <img class="credit-logo light-text" src="icons/kudometrics-logo-light-text.svg" alt="KudoMetrics" />
        <img class="credit-logo dark-text" src="icons/kudometrics-logo-dark-text.svg" alt="KudoMetrics" />
        <span>Built by KudoMetrics</span>
      </a>
    </aside>

    <div class="app-body">
      <header>
        <div class="brand">SEO <span>RenderRank</span></div>
        <nav>
          <button id="tab-current" class="tab active">Current Tab</button>
          <button id="tab-compare" class="tab">Audit URLs</button>
          <div id="header-export-slot"></div>
          <button id="compare-again" class="primary header-only" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>Audit again
          </button>
          <button id="theme-toggle" class="icon-btn" title="Switch theme"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
          <button id="open-full" class="icon-btn" title="Open full-screen dashboard"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        </nav>
      </header>

      <main id="view-current">
        <div id="current-status" class="status">Analyzing this page…</div>
        <div id="current-export" class="export-bar" hidden>
          <button class="ghost" data-export="md" data-scope="current"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Markdown</button>
          <button class="ghost" data-export="json" data-scope="current"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Download JSON</button>
        </div>
        <div id="current-report"></div>
      </main>

      <main id="view-compare" hidden>
        <section id="page-compare" class="dash-page">
          <section class="panel compare-setup">
            <div class="panel-title">
              <h2>Audit URLs</h2>
              <p>Enter two or more pages to score them side by side.</p>
            </div>
            <div class="url-inputs" id="url-inputs">
              <input type="url" class="url-input" placeholder="https://site-a.com/page" />
              <input type="url" class="url-input" placeholder="https://site-b.com/page" />
            </div>
            <input type="text" id="focus-keyword" class="url-input kw"
              placeholder="Focus keyword (optional — scores keyword targeting per page)" />
            <div class="compare-actions">
              <button id="add-url" class="ghost">+ Add URL</button>
              <button id="use-current" class="ghost"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Use current tab</button>
              <button id="run-compare" class="primary">Audit</button>
            </div>
          </section>
          <div id="compare-status" class="status" hidden></div>
          <div id="compare-export" class="export-bar" hidden>
            <button class="ghost" data-export="md" data-scope="compare"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Markdown</button>
            <button class="ghost" data-export="json" data-scope="compare"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Download JSON</button>
          </div>
          <div id="compare-report"></div>
        </section>

        <details id="history-box" class="panel dash-page">
          <summary>
            <div class="panel-title inline"><h2>Recent Comparisons</h2><p>Click one to re-run it.</p></div>
            <button id="clear-history" class="ghost mini">clear</button>
          </summary>
          <div id="history-list"></div>
        </details>

        <details id="settings-box" class="panel dash-page">
          <summary>
            <div class="panel-title inline"><h2>Settings</h2></div>
          </summary>
          <label class="setting">
            PageSpeed Insights API key <span class="hint">(optional — the Lighthouse button works without one but is rate-limited)</span>
            <input type="text" id="psi-key" class="url-input" placeholder="AIza…" />
          </label>
        </details>
      </main>

      <footer class="credit">
        <a href="https://kudometrics.com/" target="_blank" rel="noopener">
          <img class="credit-logo light-text" src="icons/kudometrics-logo-light-text.svg" alt="KudoMetrics" />
          <img class="credit-logo dark-text" src="icons/kudometrics-logo-dark-text.svg" alt="KudoMetrics" />
        </a>
        <span>Built by KudoMetrics</span>
      </footer>
    </div>
  </div>

  <script src="lib/analyzer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
